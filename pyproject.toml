[project]
name = "ppm-library"
version = "1.3.2"
description = "Unified library for polarized light microscopy - acquisition support and image analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mike Nelson", email = "msnelson8@wisc.edu"},
    {name = "Bin Li", email = "bli346@wisc.edu"},
    {name = "Jenu Chacko", email = "jenu.chacko@wisc.edu"}
]
keywords = ["ppm", "polarization", "microscopy", "image-analysis", "calibration", "fiber-orientation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-image>=0.21.0",
    "tifffile>=2023.7.0",
    "imagecodecs>=2023.7.0",  # Required for LZW and other TIFF compression codecs
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.7.0",
    "microscope-imaging>=0.1.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0.0",
]
gpu = [
    "cupy>=12.0.0",
]
bioformats = [
    "python-bioformats>=1.5.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.1.0",
]

[project.urls]
"Homepage" = "https://github.com/your-org/ppm-library"
"Bug Tracker" = "https://github.com/your-org/ppm-library/issues"

[project.scripts]
ppm-analyze = "ppm_library.analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Package files are in ppm_library/ subdirectory
packages = ["ppm_library"]

[tool.ruff]
line-length = 100
extend-select = ["C4", "NPY", "PD", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=ppm_library",
    "--cov-report=term-missing",
    "--cov-report=html",
]
